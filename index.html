<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#071a34" />
    <title>繝上ず繧ｱ繝槭・繧ｸ・・/title>

  <body>
    <div id="app">

          <div class="score-block">

          </div>
          <div class="score-block best-score-block">

            <strong id="best-value">0</strong>
          </div>
          <button id="pause-button" class="icon-button" type="button" aria-label="荳譎ょ●豁｢" title="荳譎ょ●豁｢">竇｡</button>

        <div id="danger-line" class="danger-line" aria-label="蜊ｱ髯ｺ繝ｩ繧､繝ｳ">
          <span>笞 蜊ｱ髯ｺ繝ｩ繧､繝ｳ</span>
          <span id="danger-progress" class="danger-progress"></span>
        </div>

        <div class="field-caption">MAIN FIELD</div>
        <div class="lane-caption">逋ｺ蟆・Ξ繝ｼ繝ｳ</div>

        <section class="bottom-panel" aria-label="逋ｺ蟆・桃菴・>
          <div class="next-panel">
            <div class="next-title">NEXT <span>谺｡縺ｮ繝上ず繧ｱ繧ｿ繝・/span></div>

          </div>
          <div class="launcher-panel">
            <div class="power-track" aria-label="逋ｺ蟆・ヱ繝ｯ繝ｼ">
              <div id="power-fill" class="power-fill"></div>
            </div>
            <button id="launch-button" class="launch-button" type="button" aria-label="髟ｷ謚ｼ縺励〒逋ｺ蟆・>
              <span class="launch-icon">竊・/span>
              <span>髟ｷ謚ｼ縺励〒<br />逋ｺ蟆・/span>
            </button>
            <span id="launch-hint" class="launch-hint">READY</span>
          </div>
        </section>

        <div id="combo-toast" class="toast combo-toast" role="status" aria-live="polite"></div>
        <div id="event-toast" class="toast event-toast" role="status" aria-live="polite"></div>

        <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
          <div class="overlay-card">
            <div id="overlay-kicker" class="overlay-kicker">PAUSED</div>
            <h2 id="overlay-title">荳譎ょ●豁｢荳ｭ</h2>
            <p id="overlay-message">繧ｲ繝ｼ繝繧貞・髢九〒縺阪∪縺吶・/p>
            <div id="overlay-score" class="overlay-score hidden"></div>
            <button id="overlay-action" class="primary-button" type="button">蜀埼幕</button>
          </div>
        </div>
      </div>

      <div id="landscape-message" class="landscape-message" role="status">
        <div class="phone-icon">笆ｯ</div>
        <h2>遶ｯ譛ｫ繧堤ｸｦ蜷代″縺ｫ縺励※縺上□縺輔＞</h2>
        <p>繝上ず繧ｱ繝槭・繧ｸ・√・邵ｦ逕ｻ髱｢縺ｧ驕翫∋縺ｾ縺吶・/p>
